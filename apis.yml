aid: workhuman
name: Workhuman
description: >-
  Workhuman is an enterprise employee recognition and Human Intelligence
  platform founded in 1999 (formerly Globoforce), headquartered in Framingham,
  Massachusetts with global offices including Dublin, Ireland. The platform
  serves 8M+ users across 180+ countries with configurable recognition
  programs, a global rewards store ($1B+ in annual rewards sales), and
  Workhuman iQ people analytics. It integrates recognition into Microsoft
  Teams, Outlook, Slack, Yammer, and Workday, and describes a customer-facing
  open API for custom integrations — but publishes no public developer portal,
  API documentation, or machine-readable API specifications, so no public API
  surface is indexed here.
